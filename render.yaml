services:
  - type: web
    name: ai-internship-backend
    env: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 2 -b 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      # Set these in Render dashboard as needed:
      # - key: DATABASE_URL
      #   value: <postgres-or-sqlite-url>
      # - key: SECRET_KEY
      #   generateValue: true
